[project]
name = "chatbi"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "langchain-core>=1.6.4",
    "langgraph>=1.2.12",
    "openai>=3.13.0",
    "pymysql>=1.2.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0",
    "streamlit>=1.64.0",
    "vanna==0.7.9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
